# Single source of truth for every knob that affects a reported number.
# AGENTS-ENGINEERING.md §23: one seed, defined once, threaded everywhere.

seed: 20190801  # PhysioNet/CinC Challenge 2019; arbitrary but fixed and never changed

paths:
  raw: data/raw
  interim: data/interim
  cohort: data/interim/cohort.parquet
  designs: data/interim/designs
  results: results
  metrics: results/metrics.json
  models: results/models
  search: results/hyperparameter_search.json
  threshold: results/threshold.json
  feature_drift: results/feature_drift.json
  shap_importance: results/shap_importance.json

data:
  sites:
    A: training_setA   # Beth Israel Deaconess Medical Center, Boston
    B: training_setB   # Emory University Hospital, Atlanta
  # D3: the only exclusion. Patients with fewer than this many hourly records
  # are dropped. Reported per site in docs/data_notes.md.
  min_icu_hours: 8

splits:
  # Site A is split by patient_id, 80/20. Site B is held out for scoring
  # (AGENTS.md §2.2); the rows required by the §9 matrix are produced by a
  # second, disjoint, by-patient split of site B into B_train and B_eval.
  # B_eval keeps the §2.2 warning on every access.
  train_fraction: 0.8
  site_b_train_fraction: 0.8

features:
  # D4: three windows, five statistics per variable per window.
  windows: [6, 12, 24]
  statistics: [min, max, mean, last, slope]

model:
  lightgbm:
    # §23: without these three, results move between machines and thread counts.
    deterministic: true
    force_row_wise: true
    num_threads: 4
    # A fixed tree budget for the search and the refits. 18 configurations,
    # no early stopping on the validation split (AGENTS.md §9.2: <= 20).
    n_estimators: 600
    grid:
      learning_rate: [0.02, 0.05, 0.1]
      num_leaves: [15, 31, 63]
      min_child_samples: [20, 100]

# D5: the operating threshold for every reported alert-facing number is
# utility-max on the site-A validation split, swept at 0.01 granularity.
threshold:
  sweep_step: 0.01
