# CI (AGENTS-ENGINEERING.md §21).
#
# Stages are added as the phases that need them land. Present today:
#   1. Lint          — ruff
#   2. Fast tests    — tiers 1-3, no real data, no Docker; must stay under 2 min
# Not yet present, because the code they would test does not exist yet:
#   3. Build         — Docker images          (Phase 5)
#   4. Integration   — tier 4, docker compose (Phase 6)
#   5. Publish       — GHCR, tags only        (Phase 8)
#   6. Deploy        — AWS via OIDC, tags only (§22, Phase 8)
#
# Action versions are pinned by commit SHA, not by floating tag (§21).

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # §23: string hashing must not vary between runs.
  PYTHONHASHSEED: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

  fast-tests:
    name: Fast tests (tiers 1-3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      # The whole point of tiers 1-3: they run with data/raw/ empty, against
      # the committed synthetic fixtures only (§18, §19).
      - name: Assert no real data is present
        run: |
          mkdir -p data/raw
          if find data/raw -name 'p*.psv' -print -quit | grep -q .; then
            echo "data/raw/ contains patient files in CI — the fast tier must not depend on them"
            exit 1
          fi

      - name: Run tiers 1-3
        run: uv run pytest tests/unit tests/invariant tests/fixture tests/regression --durations=10

      # The fixtures are committed. If regenerating them produces a diff, the
      # generator and the committed files have drifted apart.
      - name: Fixtures are reproducible from the generator
        run: |
          uv run python scripts/make_fixtures.py
          git diff --exit-code -- tests/fixtures/

      - name: Pipeline runs end to end on the fixtures
        run: |
          uv run python scripts/build_cohort.py \
            --raw tests/fixtures/mini_cohort \
            --out "${RUNNER_TEMP}/cohort.parquet" \
            --workers 2
          uv run python scripts/data_notes.py \
            --cohort "${RUNNER_TEMP}/cohort.parquet" \
            --out "${RUNNER_TEMP}/data_notes.md"

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck scripts/*.sh

      # §18: re-running the fetch must not re-download. With data/raw/ empty
      # there is nothing to skip, so we only assert it starts up and reports
      # honestly rather than letting CI pull 330 MB from PhysioNet.
      - name: Checksum verification runs with an empty data directory
        run: bash scripts/verify_checksums.sh
