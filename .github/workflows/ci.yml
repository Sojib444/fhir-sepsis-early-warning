# CI (AGENTS-ENGINEERING.md §21).
#
# Stages are added as the phases that need them land. Present today:
#   1. Lint          — ruff
#   2. Fast tests    — tiers 1-3, no real data, no Docker; must stay under 2 min
#   3. .NET tests    — FhirLoader + CdsService (xUnit), SDK installed via the
#                      official script so no unpinned action is needed
#   4. Build images  — CdsService + dashboard + FhirLoader (each compiles its
#                      code). The model-api image needs trained artifacts from
#                      `make train` and is built by the deploy workflow, which
#                      runs the full pipeline before publishing.
#   6. Publish       — GHCR, tags only        (.github/workflows/deploy.yml)
#   7. Deploy        — AWS via OIDC, tags only (.github/workflows/deploy.yml)
#
# Action versions are pinned by commit SHA, not by floating tag (§21).

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # §23: string hashing must not vary between runs.
  PYTHONHASHSEED: "0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format
        run: uv run ruff format --check .

  fast-tests:
    name: Fast tests (tiers 1-3)
    runs-on: ubuntu-latest
    # §21 budgets this tier at two minutes; the job-level ceiling is generous
    # headroom, but exists so a hung test is cancelled with a clear error
    # instead of burning the 6-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --all-groups --frozen

      # The whole point of tiers 1-3: they run with data/raw/ empty, against
      # the committed synthetic fixtures only (§18, §19).
      - name: Assert no real data is present
        run: |
          mkdir -p data/raw
          if find data/raw -name 'p*.psv' -print -quit | grep -q .; then
            echo "data/raw/ contains patient files in CI — the fast tier must not depend on them"
            exit 1
          fi

      - name: Run tiers 1-3
        timeout-minutes: 15
        run: uv run pytest tests/unit tests/invariant tests/fixture tests/regression --durations=10

      # The fixtures are committed. If regenerating them produces a diff, the
      # generator and the committed files have drifted apart.
      - name: Fixtures are reproducible from the generator
        run: |
          uv run python scripts/make_fixtures.py
          git diff --exit-code -- tests/fixtures/

      - name: Pipeline runs end to end on the fixtures
        run: |
          uv run python scripts/build_cohort.py \
            --raw tests/fixtures/mini_cohort \
            --out "${RUNNER_TEMP}/cohort.parquet" \
            --workers 2
          uv run python scripts/data_notes.py \
            --cohort "${RUNNER_TEMP}/cohort.parquet" \
            --out "${RUNNER_TEMP}/data_notes.md"

  shell:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        run: shellcheck scripts/*.sh deploy/*.sh

      # §18: re-running the fetch must not re-download. With data/raw/ empty
      # there is nothing to skip, so we only assert it starts up and reports
      # honestly rather than letting CI pull 330 MB from PhysioNet.
      - name: Checksum verification runs with an empty data directory
        run: bash scripts/verify_checksums.sh

  dotnet-tests:
    name: .NET tests (FhirLoader + CdsService)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # .NET 10 SDK is not preinstalled; use the official installer rather than
      # an (unpinned) setup action.
      - name: Install .NET SDK 10.0
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          chmod +x "$RUNNER_TEMP/dotnet-install.sh"
          "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"

      - name: dotnet format (verify no changes)
        run: |
          "$HOME/.dotnet/dotnet" format sepsis.slnx --verify-no-changes --verbosity minimal

      - name: dotnet test
        run: |
          "$HOME/.dotnet/dotnet" test sepsis.slnx

  build-images:
    name: Build CDS + dashboard images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each build compiles its code (dotnet publish / ng build), so this job
      # doubles as the compile check for Phase 5-7.
      - name: Build CdsService image
        run: docker build -t sepsis-cds -f src/CdsService/Dockerfile .

      - name: Build dashboard image
        run: docker build -t sepsis-dashboard src/dashboard

      - name: Build FhirLoader image
        # The demo seed CSV is baked in; CI builds with a placeholder so the
        # compile check does not depend on the (never-committed) real cohort.
        run: |
          mkdir -p deploy/loader-assets
          printf 'patient_id,site\n' > deploy/loader-assets/fhirloader.csv
          docker build -t sepsis-fhirloader -f src/FhirLoader/Dockerfile .
