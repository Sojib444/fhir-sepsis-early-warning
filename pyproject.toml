[project]
name = "sepsis"
version = "0.1.0"
description = "Sepsis early warning on the PhysioNet/CinC Challenge 2019 cohort, with honest cross-site validation."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }

dependencies = [
    "polars>=1.20,<2",
    "pyarrow>=19,<22",
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.6,<2",
    "lightgbm>=4.5,<5",
    "shap>=0.46,<1",
    # shap pulls numba; without a floor the resolver reaches for a numba/llvmlite
    # pair that predates Python 3.12 and the build fails.
    "numba>=0.60,<1",
    "matplotlib>=3.9,<4",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sepsis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "realdata: needs data/raw/ populated; skipped when absent (not run in CI)",
    "integration: needs docker compose up (tier 4)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# The official scorer is vendored verbatim (AGENTS.md §5) and must not be reformatted.
extend-exclude = ["src/sepsis/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
