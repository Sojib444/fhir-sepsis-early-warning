# Rate-limit the API edge: 10 requests/second per IP (§22).
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The dashboard's client-side routes must all fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The /api prefix is the CDS service's dashboard group (Program.cs); forward
  # the full path unchanged to the cds service container.
  location /api/ {
    limit_req zone=api burst=20 nodelay;
    proxy_pass http://cds:8990;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Liveness: used by the compose healthcheck and the CloudWatch health alarm.
  location /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  location = /favicon.ico {
    log_not_found off;
  }
}