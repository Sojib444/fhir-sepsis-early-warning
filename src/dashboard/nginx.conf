server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # The dashboard's client-side routes must all fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # The /api prefix is the CDS service's dashboard group (Program.cs); forward
  # the full path unchanged to the cds service container.
  location /api/ {
    proxy_pass http://cds:8990;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  location = /favicon.ico {
    log_not_found off;
  }
}